user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Maximum upload file size (PDFs, Excel spreadsheets)
    client_max_body_size 100M;

    upstream nextjs_upstream {
        server host.docker.internal:3000;
        keepalive 32;
    }

    # HTTP Server - Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS SSL Server
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Reverse proxy all main application requests to Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSockets / Next.js Hot Reload (HMR) support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js Webpack & Turbopack Hot Module Reloading (HMR)
        location /_next/webpack-hmr {
            proxy_pass http://nextjs_upstream/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /_next/dev-hmr {
            proxy_pass http://nextjs_upstream/_next/dev-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
